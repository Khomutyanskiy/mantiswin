[package]
name = "mantis"
version = "0.1.0"
description = "Mantis для Windows — подсчёт посетителей витрины с нескольких камер"
authors = ["РСМ АйТи"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "mantis_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-autostart = "2.5"
tauri-plugin-single-instance = "2.3"
serde = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_System_Power"] }
webview2-com = "0.39"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
