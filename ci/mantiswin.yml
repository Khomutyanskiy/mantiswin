# Сборка Mantis для Windows (Tauri + встроенный агент) на windows-latest.
# Запуск: вручную (Actions → «Mantis для Windows» → Run workflow), при каждом push в main,
# и по тегу win-v* — тогда установщик прикладывается к релизу GitHub.
name: Mantis для Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["win-v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Зависимости страницы
        working-directory: web
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Проверка страницы (типы и сверка с эталоном)
        working-directory: web
        run: |
          npx tsc --noEmit
          npx vitest run

      - name: Зависимости приложения
        run: npm ci --no-audit --no-fund

      - name: Встроенный агент (страница, нейросеть, мост камер, ffmpeg)
        run: node scripts/build-agent.mjs windows-x64

      - name: Приложение и установщик
        run: npx tauri build

      - name: Установщик в артефакты
        uses: actions/upload-artifact@v4
        with:
          name: Mantis-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Релиз по тегу
        if: startsWith(github.ref, 'refs/tags/win-v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
