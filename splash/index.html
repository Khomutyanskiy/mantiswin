<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mantis</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; }
      body {
        background: radial-gradient(1200px 600px at 30% -10%, #13204f 0%, transparent 60%), #0a1230;
        color: #e8eef8; font: 15px/1.5 "Segoe UI", system-ui, sans-serif;
        display: grid; place-items: center;
      }
      main { text-align: center; max-width: 520px; padding: 24px; }
      h1 { font-size: 24px; margin: 18px 0 6px; }
      p { color: #95a3c7; margin: 0; }
      .spin { width: 28px; height: 28px; border: 3px solid #2e3f7a; border-top-color: #8fe36d; border-radius: 50%; margin: 0 auto; animation: s 0.8s linear infinite; }
      @keyframes s { to { transform: rotate(360deg); } }
      .err { color: #ff7a66; margin-top: 14px; white-space: pre-wrap; }
      .err[hidden], .spin[hidden] { display: none; }
    </style>
  </head>
  <body>
    <main>
      <div class="spin" id="spin"></div>
      <h1>Mantis запускается…</h1>
      <p id="sub">Готовлю нейросеть и мост камер. Это несколько секунд.</p>
      <p class="err" id="err" hidden></p>
    </main>
    <script>
      // Приложение вызывает, если встроенный агент не запустился
      window.mantisSplashError = (msg) => {
        document.getElementById("spin").hidden = true;
        document.getElementById("sub").textContent = "Не получилось запустить Mantis.";
        const e = document.getElementById("err");
        e.textContent = msg;
        e.hidden = false;
      };
    </script>
  </body>
</html>
